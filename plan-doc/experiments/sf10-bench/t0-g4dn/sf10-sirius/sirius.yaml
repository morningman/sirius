# Sirius engine config template for the benchmark's Sirius backend (plan-doc
# experiments/sf10-bench, systems B / B′ and the transparent-path reference R2). Same keys as
# conf/sirius.yaml (the everyday config), with the @@...@@ placeholders filled by
# scripts/bench.sh, which writes the effective file next to the run's results:
#   16Gi  pinned host tier (per NUMA node); bench.sh sizes it from the host's RAM
#                      (min(90%, RAM - 14 GiB): the FE's JVM, the BE process and, for the
#                      buffered variant, the dataset's page cache share the box)
#   /mnt/nvme/sirius-spill      host→disk downgrade directory, on the local NVMe when there is one
#   true    true = Sirius's default O_DIRECT parquet reads (every round reads the
#                      disk); false = the B′ variant that goes through the page cache, the
#                      hot-run counterpart of Doris's own IO path (plan §6.5)
#   log/bench/sf10-sirius/telemetry  Quent per-query telemetry (memory tier events, operator timings)
sirius:
  topology: { num_gpus: 1 }
  memory:
    gpu:
      usage_limit_fraction: 0.9
    host:
      capacity_bytes: 16Gi
    disk:
      disk_id: 0
      capacity_bytes: 100Gi
      downgrade_root_dirs: "/mnt/nvme/sirius-spill"
  executor:
    scan_manager:
      local:
        use_odirect: true
  telemetry:
    enable_quent: true
    output_directory: "log/bench/sf10-sirius/telemetry"
    engine_name: sirius-doris-be
